<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Guest Speaker Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a row of ticket-stub tabs (one per talk) over a single stage where that talk's takeaways sit beside its game. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#18233b; --muted:#5b6578; --line:#d5dbe5;
  --accent:#2747d6; --accent-ink:#ffffff; --mark:#f2b33d; --good:#1f8a57; --bad:#c43d3d;
  --good-bg:#e3f4ea; --bad-bg:#fbe7e7; --chip:#e6eaf2;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141d; --surface:#181e2b; --ink:#e8ecf4; --muted:#9aa4b8; --line:#2b3446;
  --accent:#7f97ff; --accent-ink:#0e1322; --mark:#f2b33d; --good:#4fc68a; --bad:#ef7a7a;
  --good-bg:#16302a; --bad-bg:#3a1e22; --chip:#232b3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141d; --surface:#181e2b; --ink:#e8ecf4; --muted:#9aa4b8; --line:#2b3446;
  --accent:#7f97ff; --accent-ink:#0e1322; --mark:#f2b33d; --good:#4fc68a; --bad:#ef7a7a;
  --good-bg:#16302a; --bad-bg:#3a1e22; --chip:#232b3c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
header.top h1{font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-.02em}
header.top p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--ink)}

/* Ticket-stub tabs */
.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;min-width:150px;max-width:220px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 18px;position:relative;display:grid;gap:2px}
.tab::before{content:"";position:absolute;left:-1px;top:50%;width:10px;height:18px;margin-top:-9px;background:var(--bg);border:1px solid var(--line);border-left:none;border-radius:0 10px 10px 0}
.tab .no{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.tab .nm{font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .tp{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .no,.tab[aria-selected="true"] .tp{color:var(--bg);opacity:.75}
.tab.add{border-style:dashed;background:transparent;color:var(--accent);min-width:130px;place-content:center}
.tab.add .nm{font-size:15px}

/* Stage */
.stage{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.stage{grid-template-columns:1fr}}
.brief{display:grid;gap:14px;padding-top:4px}
.brief h2{font-size:28px;font-weight:700}
.brief .who{color:var(--muted);font-size:15px}
.brief ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.brief li{padding-left:18px;position:relative}
.brief li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;background:var(--mark);border-radius:2px}
.brief .actions{display:flex;gap:8px;flex-wrap:wrap}
.game{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0;display:grid;gap:16px}
.game-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.game-head h3{font-size:20px}
.score{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;background:var(--chip);padding:4px 10px;border-radius:999px}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:10px 16px;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.btn.alt{background:var(--chip);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);padding:24px 0}
.note{font-size:14px;color:var(--muted)}

/* Quiz */
.q{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.25}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.explain{border-left:4px solid var(--mark);padding:6px 12px;background:var(--bg);border-radius:0 8px 8px 0}
.progress{height:6px;background:var(--chip);border-radius:6px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}

/* Match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start;min-width:0}
.card{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;overflow-wrap:anywhere}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.card.done{border-color:var(--good);background:var(--good-bg);opacity:.7;cursor:default}
.card.shake{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Flashcards */
.flip{perspective:1000px;cursor:pointer;border:none;background:none;padding:0;width:100%}
.flip-in{position:relative;min-height:220px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;padding:24px;text-align:center;background:var(--bg)}
.face.back{transform:rotateY(180deg);background:var(--ink);color:var(--bg);border-color:var(--ink)}
.face .big{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.2}
.face .hint{position:absolute;bottom:10px;font-family:var(--f-mono);font-size:11px;opacity:.6;letter-spacing:.06em}

/* Sort */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{background:var(--chip);border:2px solid transparent;border-radius:999px;padding:6px 14px;font-size:15px}
.chip.sel{border-color:var(--accent)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bucket{text-align:left;border:2px dashed var(--line);border-radius:12px;padding:12px;background:var(--bg);display:grid;gap:8px;align-content:start;min-height:110px}
.bucket.ready{border-color:var(--accent)}
.bucket h4{margin:0;font-family:var(--f-display);font-size:16px}
.bucket .in{display:flex;flex-wrap:wrap;gap:6px}
.bucket .in span{font-size:13px;background:var(--good-bg);color:var(--ink);border-radius:999px;padding:3px 10px}

/* Editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.editor{grid-template-columns:1fr}}
.form{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.form h2{font-size:24px}
.field{display:grid;gap:6px}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.field textarea{min-height:90px;resize:vertical;font-family:var(--f-mono);font-size:13px;line-height:1.5}
.field textarea#f-game{min-height:220px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.howto{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px;white-space:pre-wrap;font-family:var(--f-mono);overflow-x:auto}
.danger{color:var(--bad);border-color:var(--bad)}
.status{font-size:14px;min-height:1.4em}
.status.err{color:var(--bad)}
.status.ok{color:var(--good)}
.preview-label{margin-bottom:8px}
.publish-bar{display:grid;gap:12px;background:var(--surface);border:2px solid var(--mark);border-radius:12px;padding:14px 16px}
.publish-bar a.btn{text-decoration:none;display:inline-block}
.copybox{width:100%;min-height:120px;font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="label" id="eyebrow">Guest lectures · Fall 2026</div>
      <h1 id="site-title">Guest Speaker Series</h1>
      <p id="site-sub">One tab per session. Play the game to lock in what each speaker taught.</p>
    </div>
    <button class="ghost" id="edit-site" hidden>Edit title</button>
  </header>
  <div class="publish-bar" id="publish-bar" role="status" hidden></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Guest sessions"></nav>
  <main id="main"></main>
</div>

<script id="fallback-data" type="application/json">
{"title":"Guest Speaker Series","subtitle":"One tab per session. Play the game to lock in what each speaker taught.","sessions":[{"id":"example","speaker":"Example speaker","role":"Replace this with a real session","date":"2026-10-09","topic":"How this site works","takeaways":"Each guest session gets its own tab\nAdd key takeaways here, one per line\nPick a game type and paste in your content","game":{"type":"quiz","text":"What do you click to add a new guest session?\n*The + Add session tab\nThe speaker's name\nThe score counter\n> The + Add session tab opens the editor. It only shows for people who can edit this page.\n\nHow do you mark the correct answer in a quiz?\nPut it first\n*Start the line with *\nWrite it in capitals\n> Any option can be correct. Just start its line with an asterisk.\n\nWhich game fits a list of terms and their meanings best?\n*Matching or flashcards\nSorting\nNone of them\n> Terms with meanings work as matching pairs or flashcards. Sorting suits items that belong to groups."}}]}
</script>

<script>
(function(){
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k,'');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const lines = t => (t||'').split('\n').map(s=>s.trim()).filter(Boolean);

const GAME_TYPES = {
  quiz:  {name:'Quiz', help:
`One question per block, blank line between blocks.
First line = the question.
Each next line = an answer option.
Start the correct option with *
Optional: a line starting with > explains the answer.

What does CAC stand for?
*Customer acquisition cost
Cost after commission
Capital allocation cycle
> CAC is what you spend to win one new customer.`},
  match: {name:'Matching pairs', help:
`One pair per line: term = meaning

Moat = A lasting advantage competitors can't copy
Burn rate = Cash a company spends each month
Runway = Months until the cash runs out`},
  flash: {name:'Flashcards', help:
`One card per line: front = back

Speaker's #1 rule for pitching = Lead with the problem, not the product
Best question to ask a mentor = What would you do in my place?`},
  sort:  {name:'Sort into groups', help:
`One group per line: Group name: item; item; item

Do: Ask follow-up questions; Send a thank-you note
Don't: Read your slides aloud; Skip the research`}
};

function parseGame(g){
  const t = g?.text || '';
  switch(g?.type){
    case 'quiz': return t.split(/\n\s*\n/).map(b=>{
      const ls = lines(b); if (!ls.length) return null;
      const q = ls[0]; let explain = '';
      const opts = [];
      for (const l of ls.slice(1)){
        if (l.startsWith('>')) explain = l.slice(1).trim();
        else if (l.startsWith('*')) opts.push({text:l.slice(1).trim(), ok:true});
        else opts.push({text:l, ok:false});
      }
      return opts.length >= 2 && opts.some(o=>o.ok) ? {q, opts, explain} : null;
    }).filter(Boolean);
    case 'match': case 'flash': return lines(t).map(l=>{
      const i = l.indexOf('='); if (i<1) return null;
      const a = l.slice(0,i).trim(), b = l.slice(i+1).trim();
      return a && b ? {a,b} : null;
    }).filter(Boolean);
    case 'sort': return lines(t).map(l=>{
      const i = l.indexOf(':'); if (i<1) return null;
      const name = l.slice(0,i).trim(); const rest = l.slice(i+1);
      const items = rest.split(rest.includes(';') ? ';' : ',').map(s=>s.trim()).filter(Boolean);
      return items.length ? {name, items} : null;
    }).filter(Boolean);
  }
  return [];
}

/* ---------- Games ---------- */
function emptyGame(msg){ return el('p',{class:'empty'}, msg || 'No game content yet. Open the editor to add some.'); }

function quizGame(data){
  const box = el('div',{class:'game'});
  let i=0, score=0, order=[];
  const start = () => { i=0; score=0; order = data.map(d=>({...d, opts:shuffle(d.opts)})); draw(); };
  function draw(){
    box.replaceChildren();
    const sc = el('span',{class:'score'}, `${score} / ${data.length}`);
    box.append(el('div',{class:'game-head'}, el('h3',{},'Quiz'), sc));
    if (i >= order.length){
      const pct = Math.round(score/data.length*100);
      box.append(el('div',{class:'progress'}, el('span',{style:'width:100%'})),
        el('p',{class:'q'}, pct===100 ? 'Perfect score.' : pct>=60 ? `You got ${score} of ${data.length}. Solid.` : `You got ${score} of ${data.length}. Worth another round.`),
        el('div',{class:'row'}, el('button',{class:'btn',onclick:start},'Play again')));
      return;
    }
    const cur = order[i];
    box.append(el('div',{class:'progress'}, el('span',{style:`width:${i/order.length*100}%`})),
      el('div',{class:'label'}, `Question ${i+1} of ${order.length}`),
      el('p',{class:'q'}, cur.q));
    const opts = el('div',{class:'opts'});
    const after = el('div',{class:'row'});
    cur.opts.forEach(o=>{
      const b = el('button',{class:'opt',onclick:()=>{
        [...opts.children].forEach((c,k)=>{ c.disabled=true; if (cur.opts[k].ok) c.classList.add('right'); });
        if (o.ok){ score++; sc.textContent = `${score} / ${data.length}`; } else b.classList.add('wrong');
        if (cur.explain) opts.after(el('p',{class:'explain'}, cur.explain));
        after.append(el('button',{class:'btn',onclick:()=>{i++;draw();}}, i+1<order.length ? 'Next question' : 'See result'));
        after.querySelector('button').focus();
      }}, o.text);
      opts.append(b);
    });
    box.append(opts, after);
  }
  start(); return box;
}

function matchGame(data){
  const box = el('div',{class:'game'});
  function start(){
    box.replaceChildren();
    let pick=null, found=0, tries=0;
    const sc = el('span',{class:'score'}, `0 / ${data.length} matched`);
    box.append(el('div',{class:'game-head'}, el('h3',{},'Match the pairs'), sc),
      el('p',{class:'note'}, 'Pick a term on the left, then its meaning on the right.'));
    const left = el('div',{class:'col'}), right = el('div',{class:'col'});
    const lefts = shuffle(data.map((d,k)=>({t:d.a,k}))), rights = shuffle(data.map((d,k)=>({t:d.b,k})));
    const mk = (item, side) => el('button',{class:'card',onclick:e=>{
      const b=e.currentTarget; if (b.classList.contains('done')) return;
      if (side==='L'){ left.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); pick={b,k:item.k}; return; }
      if (!pick) { b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),300); return; }
      tries++;
      if (pick.k===item.k){ [pick.b,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done');x.disabled=true;}); found++; pick=null;
        sc.textContent = `${found} / ${data.length} matched`;
        if (found===data.length) box.append(el('div',{class:'row'}, el('p',{class:'q'},`All matched in ${tries} tries.`), el('button',{class:'btn',onclick:start},'Play again')));
      } else { [pick.b,b].forEach(x=>{x.classList.add('shake');setTimeout(()=>x.classList.remove('shake'),300);}); }
    }}, item.t);
    lefts.forEach(it=>left.append(mk(it,'L'))); rights.forEach(it=>right.append(mk(it,'R')));
    box.append(el('div',{class:'match'}, left, right));
  }
  start(); return box;
}

function flashGame(data){
  const box = el('div',{class:'game'});
  let deck=[], i=0, known=0;
  const start = () => { deck=shuffle(data); i=0; known=0; draw(); };
  function draw(){
    box.replaceChildren();
    box.append(el('div',{class:'game-head'}, el('h3',{},'Flashcards'), el('span',{class:'score'}, `Knew ${known} · Card ${Math.min(i+1,deck.length)} / ${deck.length}`)));
    if (i>=deck.length){
      box.append(el('p',{class:'q'}, `You knew ${known} of ${deck.length} cards.`), el('div',{class:'row'}, el('button',{class:'btn',onclick:start},'Shuffle and go again')));
      return;
    }
    const c = deck[i];
    const card = el('button',{class:'flip','aria-label':'Flip card',onclick:()=>card.classList.toggle('on')},
      el('div',{class:'flip-in'},
        el('div',{class:'face'}, el('div',{class:'big'}, c.a), el('span',{class:'hint'},'TAP TO FLIP')),
        el('div',{class:'face back'}, el('div',{class:'big'}, c.b))));
    box.append(card, el('div',{class:'row'},
      el('button',{class:'btn alt',onclick:()=>{i++;draw();}},'Still learning'),
      el('button',{class:'btn',onclick:()=>{known++;i++;draw();}},'I knew it')));
  }
  start(); return box;
}

function sortGame(data){
  const box = el('div',{class:'game'});
  function start(){
    box.replaceChildren();
    const all = shuffle(data.flatMap((g,k)=>g.items.map(t=>({t,k}))));
    let pick=null, right=0, wrong=0, left=all.length;
    const sc = el('span',{class:'score'}, `0 placed · 0 missed`);
    const pool = el('div',{class:'pool'});
    const buckets = el('div',{class:'buckets'});
    box.append(el('div',{class:'game-head'}, el('h3',{},'Sort into groups'), sc),
      el('p',{class:'note'}, 'Pick an item, then the group it belongs to.'), pool, buckets);
    all.forEach(it=>pool.append(el('button',{class:'chip',onclick:e=>{
      pool.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));
      e.currentTarget.classList.add('sel'); pick={b:e.currentTarget,it};
      buckets.querySelectorAll('.bucket').forEach(x=>x.classList.add('ready'));
    }}, it.t)));
    data.forEach((g,k)=>{
      const inner = el('div',{class:'in'});
      const b = el('button',{class:'bucket',onclick:()=>{
        if (!pick) return;
        if (pick.it.k===k){ right++; left--; inner.append(el('span',{},pick.it.t)); pick.b.remove(); pick=null;
          buckets.querySelectorAll('.bucket').forEach(x=>x.classList.remove('ready'));
          if (!left) box.append(el('div',{class:'row'}, el('p',{class:'q'}, wrong ? `Done, with ${wrong} miss${wrong>1?'es':''}.` : 'All sorted, no misses.'), el('button',{class:'btn',onclick:start},'Play again')));
        } else { wrong++; b.classList.add('shake'); pick.b.classList.add('shake'); const pb=pick.b; setTimeout(()=>{b.classList.remove('shake');pb.classList.remove('shake');},300); }
        sc.textContent = `${right} placed · ${wrong} missed`;
      }}, el('h4',{}, g.name), inner);
      buckets.append(b);
    });
  }
  start(); return box;
}

function renderGame(game){
  const data = parseGame(game);
  if (!data.length) { const b = el('div',{class:'game'}); b.append(emptyGame()); return b; }
  if (game.type==='match' && data.length<2) { const b = el('div',{class:'game'}); b.append(emptyGame('Add at least two pairs to play matching.')); return b; }
  return ({quiz:quizGame, match:matchGame, flash:flashGame, sort:sortGame})[game.type](data);
}

/* ---------- State ---------- */
let state = JSON.parse($('#fallback-data').textContent);
let current = null;
let canEdit = false, artifactApi = null;

const sorted = () => state.sessions.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
const fmtDate = d => { if (!d) return 'Date TBC'; const x = new Date(d+'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString(undefined,{day:'numeric',month:'short'}); };

function renderHeader(){
  $('#site-title').textContent = state.title || 'Guest Speaker Series';
  $('#site-sub').textContent = state.subtitle || '';
  $('#edit-site').hidden = !canEdit;
}

function renderTabs(){
  const tabs = $('#tabs'); tabs.replaceChildren();
  sorted().forEach((s,k)=>{
    tabs.append(el('button',{class:'tab',role:'tab','aria-selected':String(s.id===current),onclick:()=>select(s.id)},
      el('span',{class:'no'}, `TALK ${String(k+1).padStart(2,'0')} · ${fmtDate(s.date).toUpperCase()}`),
      el('span',{class:'nm'}, s.speaker || 'Untitled speaker'),
      el('span',{class:'tp'}, s.topic || '')));
  });
  if (canEdit) tabs.append(el('button',{class:'tab add',onclick:()=>openEditor(null)}, el('span',{class:'nm'},'+ Add session')));
}

function select(id){
  current = id; try{ history.replaceState(null,'','#'+id); }catch(e){}
  renderTabs(); renderSession();
}

function renderSession(){
  const main = $('#main');
  const s = state.sessions.find(x=>x.id===current);
  if (!s){
    main.replaceChildren(el('div',{class:'game'}, el('p',{class:'empty'}, canEdit ? 'No sessions yet. Use + Add session to create the first tab.' : 'No sessions yet. Check back after the first guest talk.')));
    return;
  }
  const tk = lines(s.takeaways);
  main.replaceChildren(el('section',{class:'stage'},
    el('div',{class:'brief'},
      el('div',{class:'label'}, fmtDate(s.date) + ' · ' + (GAME_TYPES[s.game?.type]?.name || 'Game')),
      el('h2',{}, s.topic || 'Untitled session'),
      el('div',{class:'who'}, el('strong',{}, s.speaker || ''), s.role ? ' · ' + s.role : ''),
      tk.length ? el('div',{}, el('div',{class:'label',style:'margin-bottom:8px'},'Key takeaways'), el('ul',{}, tk.map(t=>el('li',{},t)))) : null,
      canEdit ? el('div',{class:'actions'}, el('button',{class:'ghost',onclick:()=>openEditor(s.id)},'Edit this session')) : null),
    renderGame(s.game)));
}

function renderAll(){
  renderHeader();
  if (!state.sessions.find(x=>x.id===current)) current = sorted()[0]?.id || null;
  renderTabs(); renderSession();
}

/* ---------- Saving ---------- */
const STATIC = !window.claude?.use;           // true on GitHub Pages / plain hosting
const DRAFT_KEY = 'speakertab-draft';
const GH_EDIT_URL = 'https://github.com/Christine0515/SpeakerTab/edit/main/data.json';
function storeDraft(d){ try{ d ? localStorage.setItem(DRAFT_KEY, JSON.stringify(d)) : localStorage.removeItem(DRAFT_KEY); }catch(e){} }
function readDraft(){ try{ return JSON.parse(localStorage.getItem(DRAFT_KEY)||'null'); }catch(e){ return null; } }
function renderBanner(){
  const bar = $('#publish-bar'); if (!bar) return;
  const pending = STATIC && canEdit && !!readDraft();
  bar.hidden = !pending; if (!pending) return;
  const msg = el('span',{class:'note'});
  bar.replaceChildren(
    el('div',{}, el('strong',{},'Your changes are only in this browser.'), el('div',{class:'note'},'To put them online: 1) copy the data, 2) open data.json on GitHub, select everything, paste, then click Commit changes.')),
    el('div',{class:'row'},
      el('button',{class:'btn',onclick:async()=>{
        const txt = JSON.stringify(state,null,2);
        try{ await navigator.clipboard.writeText(txt); msg.textContent='Copied.'; }
        catch(e){ const ta=el('textarea',{class:'copybox',readonly:true}); ta.value=txt; bar.append(ta); ta.select(); msg.textContent='Copy the selected text below.'; }
      }},'1. Copy data'),
      el('a',{class:'btn alt',href:GH_EDIT_URL,target:'_blank',rel:'noopener'},'2. Open data.json on GitHub'),
      el('button',{class:'ghost',onclick:()=>{ storeDraft(null); location.reload(); }},'Discard changes'),
      msg));
}
async function save(next){
  if (STATIC){ state = next; storeDraft(next); renderBanner(); return; }
  if (!artifactApi) throw {code:'unavailable'};
  await artifactApi.publish({'data.json': {content: JSON.stringify(next, null, 2), contentType:'application/json'}});
  state = next;
}
function saveMessage(e){
  const c = e?.code;
  if (c==='conflict') return 'Someone saved a newer version. The page is reloading with it; re-apply your change after.';
  if (c==='not_writer' || c==='not_granted' || c==='consent_required') return 'This view is read-only, so changes can’t be saved here.';
  if (c==='capability_disabled' || c==='unavailable') return 'Saving isn’t available in this view. Open the page from your claude.ai account to edit.';
  if (c==='rate_limited') return 'Saving too often. Wait a moment, then save again.';
  return 'Couldn’t save just now. Try again in a moment.';
}

/* ---------- Editor ---------- */
function openEditor(id){
  const s = id ? state.sessions.find(x=>x.id===id) : {id:null, speaker:'', role:'', date:'', topic:'', takeaways:'', game:{type:'quiz', text:''}};
  const main = $('#main');
  const f = (lbl, input) => el('label',{class:'field'}, el('span',{class:'label'},lbl), input);
  const iSpeaker = el('input',{id:'f-speaker',value:s.speaker||'',placeholder:'e.g. Amira Haddad'});
  const iRole = el('input',{id:'f-role',value:s.role||'',placeholder:'e.g. VP Strategy, Danone'});
  const iDate = el('input',{id:'f-date',type:'date',value:s.date||''});
  const iTopic = el('input',{id:'f-topic',value:s.topic||'',placeholder:'e.g. Pricing in inflationary markets'});
  const iTake = el('textarea',{id:'f-take',placeholder:'One takeaway per line'}); iTake.value = s.takeaways||'';
  const iType = el('select',{id:'f-type'}, Object.entries(GAME_TYPES).map(([k,v])=>el('option',{value:k, selected:k===s.game?.type},v.name)));
  const iGame = el('textarea',{id:'f-game'}); iGame.value = s.game?.text||'';
  const help = el('div',{class:'howto'});
  const useEx = el('button',{class:'ghost',type:'button',onclick:()=>{ iGame.value = GAME_TYPES[iType.value].help.split('\n\n').slice(1).join('\n\n'); refresh(); }},'Insert example');
  const status = el('div',{class:'status',role:'status'});
  const prev = el('div',{});
  const draft = () => ({...s, speaker:iSpeaker.value.trim(), role:iRole.value.trim(), date:iDate.value, topic:iTopic.value.trim(), takeaways:iTake.value, game:{type:iType.value, text:iGame.value}});
  function refresh(){
    help.textContent = GAME_TYPES[iType.value].help;
    iGame.placeholder = 'Paste your game content here. Format below.';
    const n = parseGame(draft().game).length;
    prev.replaceChildren(el('div',{class:'label preview-label'}, `Live preview · ${n} item${n===1?'':'s'} recognised`), renderGame(draft().game));
  }
  [iType, iGame].forEach(x=>x.addEventListener('input', refresh));

  const saveBtn = el('button',{class:'btn',type:'submit'}, id ? 'Save changes' : 'Add session');
  const delWrap = el('div',{class:'row'});
  if (id){
    const askDel = el('button',{class:'ghost danger',type:'button',onclick:()=>{
      delWrap.replaceChildren(el('span',{class:'note'},'Delete this session for everyone?'),
        el('button',{class:'ghost danger',type:'button',onclick:async()=>{
          status.className='status'; status.textContent='Deleting…';
          try{ await save({...state, sessions: state.sessions.filter(x=>x.id!==id)}); current=null; renderAll(); }
          catch(e){ status.className='status err'; status.textContent = saveMessage(e); }
        }},'Yes, delete'),
        el('button',{class:'ghost',type:'button',onclick:()=>delWrap.replaceChildren(askDel)},'Keep it'));
    }},'Delete session');
    delWrap.append(askDel);
  }

  const form = el('form',{class:'form',onsubmit:async e=>{
    e.preventDefault();
    const d = draft();
    if (!d.speaker && !d.topic){ status.className='status err'; status.textContent='Add at least a speaker name or a topic.'; return; }
    if (!d.id) d.id = 's' + Date.now().toString(36);
    saveBtn.disabled = true; status.className='status'; status.textContent='Saving…';
    const sessions = state.sessions.filter(x=>x.id!==d.id).concat([d]);
    try{ await save({...state, sessions}); current = d.id; renderAll(); try{ history.replaceState(null,'','#'+d.id);}catch(_){}}
    catch(err){ saveBtn.disabled=false; status.className='status err'; status.textContent = saveMessage(err); }
  }},
    el('h2',{}, id ? 'Edit session' : 'New guest session'),
    el('div',{class:'two'}, f('Speaker', iSpeaker), f('Date', iDate)),
    f('Role or company', iRole),
    f('Session topic', iTopic),
    f('Key takeaways', iTake),
    el('div',{class:'two'}, f('Game type', iType), el('div',{class:'field',style:'align-content:end'}, useEx)),
    f('Game content', iGame),
    help,
    el('div',{class:'row'}, saveBtn, el('button',{class:'btn alt',type:'button',onclick:()=>{ renderAll(); }},'Cancel')),
    status, delWrap);

  main.replaceChildren(el('section',{class:'editor'}, form, prev));
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected','false'));
  refresh(); iSpeaker.focus();
}

function openSiteEditor(){
  const main = $('#main');
  const iT = el('input',{id:'f-site-title',value:state.title||''});
  const iS = el('input',{id:'f-site-sub',value:state.subtitle||''});
  const status = el('div',{class:'status',role:'status'});
  main.replaceChildren(el('form',{class:'form',style:'max-width:620px',onsubmit:async e=>{
    e.preventDefault(); status.textContent='Saving…';
    try{ await save({...state, title:iT.value.trim(), subtitle:iS.value.trim()}); renderAll(); }
    catch(err){ status.className='status err'; status.textContent=saveMessage(err); }
  }}, el('h2',{},'Site title'),
    el('label',{class:'field'}, el('span',{class:'label'},'Title'), iT),
    el('label',{class:'field'}, el('span',{class:'label'},'Subtitle'), iS),
    el('div',{class:'row'}, el('button',{class:'btn',type:'submit'},'Save'), el('button',{class:'btn alt',type:'button',onclick:renderAll},'Cancel')),
    status));
}
$('#edit-site').addEventListener('click', openSiteEditor);

/* ---------- Boot ---------- */
async function boot(){
  try{
    const r = await fetch('data.json', {cache:'no-store'});
    if (r.ok){ const j = await r.json(); if (j && Array.isArray(j.sessions)) state = j; }
  }catch(e){}
  const hash = (location.hash||'').slice(1);
  if (STATIC){
    canEdit = /[?&]edit\b/.test(location.search);
    const d = canEdit && readDraft();
    if (d && Array.isArray(d.sessions)){
      if (JSON.stringify(d) === JSON.stringify(state)) storeDraft(null); else state = d;
    }
  }
  current = state.sessions.some(s=>s.id===hash) ? hash : null;
  renderAll(); renderBanner();
  if (window.claude?.use){
    try{
      const [user, art] = await Promise.all([claude.use('user'), claude.use('artifact')]);
      artifactApi = art;
      canEdit = !!(art && user && user.canEdit && await user.canEdit());
      if (canEdit) renderAll();
    }catch(e){}
  }
}
renderAll();
boot();
})();
</script>
